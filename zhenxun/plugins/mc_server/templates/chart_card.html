{% import './_icons.html' as icons %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    {% include './_mc_style.css' %}
  </style>
</head>
<body>
  <div class="mc-wrapper">
    <div class="mc-card">
      <div class="card-head">
        <div class="title-group">
          <p class="eyebrow">MC 在线人数</p>
          <h1 class="page-title">{{ title }}</h1>
          <div class="subtle">{{ range_hint }}</div>
        </div>
        <span class="level-badge">{{ sample_count }} 个采样</span>
      </div>

      {% if points %}
      <div class="chart-shell">
        <div id="online-count-chart" class="chart-container"></div>
      </div>
      {% else %}
      <div class="empty">暂无人数采样</div>
      {% endif %}
    </div>
  </div>

  {% if points %}
  <script src="{{ asset('js/echarts.min.js') }}"></script>
  <script>
    const chartDom = document.getElementById("online-count-chart");
    if (chartDom) {
      const chart = echarts.init(chartDom);
      const rootStyle = getComputedStyle(document.documentElement);
      const primaryColor = rootStyle.getPropertyValue("--color-primary-dark").trim() || "#d14775";
      const softColor = rootStyle.getPropertyValue("--color-primary").trim() || "#ff6699";
      const mutedColor = rootStyle.getPropertyValue("--color-text-muted").trim() || "#9b7582";
      const borderColor = rootStyle.getPropertyValue("--color-border").trim() || "#ffe0ea";

      chart.setOption({
        backgroundColor: "transparent",
        animation: false,
        grid: { top: 28, bottom: 34, left: 46, right: 20 },
        tooltip: {
          trigger: "axis",
          valueFormatter: (value) => `${value} 人`,
          axisPointer: {
            type: "line",
            lineStyle: { color: borderColor, width: 1 }
          }
        },
        xAxis: {
          type: "category",
          boundaryGap: false,
          data: {{ labels | dump_json | safe }},
          axisTick: { show: false },
          axisLabel: { color: mutedColor, fontSize: 11, fontWeight: 500 },
          axisLine: { lineStyle: { color: borderColor, width: 1 } }
        },
        yAxis: {
          type: "value",
          minInterval: 1,
          axisTick: { show: false },
          axisLabel: { color: mutedColor, fontSize: 11 },
          axisLine: { show: true, lineStyle: { color: borderColor, width: 1 } },
          splitLine: { lineStyle: { color: "rgba(209, 71, 117, 0.12)", type: "dashed" } }
        },
        series: [{
          name: "在线人数",
          type: "line",
          smooth: true,
          symbol: "circle",
          symbolSize: 7,
          data: {{ counts | dump_json | safe }},
          lineStyle: { color: primaryColor, width: 3 },
          itemStyle: { color: primaryColor, borderColor: "#fff", borderWidth: 2 },
          areaStyle: { color: "rgba(255, 102, 153, 0.14)" },
          emphasis: { focus: "series" }
        }]
      });
    }
  </script>
  {% endif %}
</body>
</html>
