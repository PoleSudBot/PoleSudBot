<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>更新管理</title>
  <style>
    :root {
      --primary-color: #f472b6;
      --primary-color-light: #f9a8d4;
      --bg-color: #fff7fb;
      --bg-color-secondary: rgba(255, 255, 255, 0.92);
      --bg-color-hover: #fce7f3;
      --border-color: #fbcfe8;
      --text-color: #334155;
      --text-muted: #64748b;
      --font-main: "HarmonyOS Sans SC", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --success-color: #16a34a;
      --warning-color: #d97706;
      --danger-color: #dc2626;
      --shadow: 0 12px 28px rgba(244, 114, 182, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-main);
      color: var(--text-color);
      background: var(--bg-color);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 14px;
      cursor: pointer;
      background: var(--primary-color);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 38px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 8px 18px rgba(244, 114, 182, 0.22);
      white-space: nowrap;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(244, 114, 182, 0.28);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
      box-shadow: none;
    }

    button.secondary {
      color: var(--text-color);
      background: #fff;
      border: 1px solid var(--border-color);
      box-shadow: none;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--text-color);
      background: #fff;
      min-height: 38px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--primary-color-light);
      box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.18);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      border-bottom: 1px solid rgba(251, 207, 232, 0.8);
      background: var(--bg-color);
    }

    .topbar {
      max-width: 1280px;
      margin: 0 auto;
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .stat,
    .panel {
      background: var(--bg-color-secondary);
      border: 1px solid rgba(251, 207, 232, 0.75);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .stat {
      padding: 16px;
    }

    .stat .label {
      color: var(--text-muted);
      font-size: 13px;
    }

    .stat .value {
      margin-top: 8px;
      font-weight: 700;
      font-size: 28px;
    }

    .panel {
      padding: 16px;
      margin-bottom: 16px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 160px repeat(5, auto);
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .auto-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .auto-title {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .auto-title h2 {
      margin: 0;
      font-size: 17px;
    }

    .auto-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .auto-controls input[type="time"] {
      width: 126px;
    }

    .addbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 10px;
      margin-top: 14px;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid #f1f5f9;
      border-radius: 8px;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #f1f5f9;
      text-align: left;
      font-size: 13px;
      vertical-align: top;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #fff1f7;
      color: #475569;
      font-weight: 650;
    }

    tr:last-child td { border-bottom: 0; }

    tr.repo-row.busy {
      background: #fffafd;
    }

    .repo-name {
      font-weight: 650;
      color: #1f2937;
    }

    .path {
      margin-top: 4px;
      max-width: 360px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-muted);
      font-size: 12px;
    }

    .remote-line {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      min-width: 0;
      max-width: 420px;
      font-size: 12px;
    }

    .remote-label {
      color: var(--text-muted);
      flex: 0 0 auto;
    }

    .remote-link,
    .remote-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remote-link {
      color: #be185d;
      text-decoration: none;
    }

    .remote-link:hover {
      text-decoration: underline;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }

    .badge.ok { color: #15803d; background: #dcfce7; }
    .badge.warn { color: #b45309; background: #fef3c7; }
    .badge.bad { color: #b91c1c; background: #fee2e2; }
    .badge.muted { color: #475569; background: #f1f5f9; }
    .badge.kind { color: #be185d; background: #fce7f3; }
    .badge.running { color: #be185d; background: #fce7f3; }
    .badge.latest { color: #0369a1; background: #e0f2fe; }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 999px;
      animation: spin 0.8s linear infinite;
      flex: 0 0 auto;
    }

    .status-line {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .muted { color: var(--text-muted); }
    .mono { font-family: var(--font-mono); }
    .right { text-align: right; }

    pre {
      margin: 0;
      padding: 14px;
      max-height: 320px;
      overflow: auto;
      border-radius: 8px;
      background: #0f172a;
      color: #e0f2fe;
      white-space: pre-wrap;
      font-size: 12px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 17px;
    }

    .error {
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid #fecaca;
      border-radius: 8px;
      color: #991b1b;
      background: #fef2f2;
      display: none;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .select-cell {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    input.table-check {
      width: 16px;
      height: 16px;
      min-height: 0;
      padding: 0;
      flex: 0 0 auto;
      cursor: pointer;
      accent-color: var(--primary-color);
    }

    .toggle-commits {
      width: 28px;
      min-height: 28px;
      padding: 0;
      color: var(--text-muted);
      background: #fff;
      border: 1px solid var(--border-color);
      box-shadow: none;
    }

    .toggle-commits.open {
      color: #fff;
      background: var(--primary-color);
    }

    .commit-panel {
      background: #fffafd;
    }

    .commit-box {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid #f1f5f9;
      border-radius: 8px;
      background: #fff;
    }

    .version-summary {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      line-height: 1.8;
    }

    .commit-row {
      display: grid;
      grid-template-columns: 190px minmax(220px, 1fr) 120px 96px auto;
      gap: 10px;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 12px;
    }

    .commit-row.marked {
      background: #fff7fb;
      margin: 0 -8px;
      padding-left: 8px;
      padding-right: 8px;
      border-radius: 8px;
    }

    .commit-id {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .commit-row:last-child {
      border-bottom: 0;
    }

    .commit-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .commit-actions button {
      min-height: 30px;
      padding: 6px 10px;
      font-size: 12px;
    }

    button.danger {
      background: var(--danger-color);
      box-shadow: 0 8px 18px rgba(220, 38, 38, 0.18);
    }

    .login-panel {
      max-width: 420px;
      margin: 72px auto 0;
      padding: 22px;
      background: var(--bg-color-secondary);
      border: 1px solid rgba(251, 207, 232, 0.75);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .login-panel h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .login-panel p {
      margin: 0 0 16px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .login-form {
      display: grid;
      gap: 10px;
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .toolbar button,
      .addbar button {
        width: 100%;
      }
    }

    @media (max-width: 640px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1 1 auto;
      }

      .auto-panel {
        align-items: stretch;
      }

      .auto-controls {
        width: 100%;
      }

      .auto-controls button {
        flex: 1 1 auto;
      }

      main,
      .topbar {
        padding-left: 14px;
        padding-right: 14px;
      }

      .grid,
      .toolbar,
      .addbar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand">
      <h1>更新管理</h1>
      <p>Bot 本体、resources 与第三方插件 fork；sidecar/gscore 不在此处处理。</p>
    </div>
    <div class="actions">
      <button id="logoutButton" class="secondary" onclick="logout()" hidden>退出登录</button>
      <button class="secondary" onclick="location.href='/'">返回 WebUI</button>
    </div>
  </div>
</header>

<section id="loginPanel" class="login-panel" hidden>
  <h2>进入更新管理</h2>
  <p>输入 WebUI 密码后，同一 IP 在 Bot 后端重启前无需再次登录。</p>
  <div class="login-form">
    <input id="loginPassword" type="password" placeholder="WebUI 密码" autocomplete="current-password" />
    <button onclick="login()">登录</button>
  </div>
</section>

<main id="appMain" hidden>
  <div id="error" class="error"></div>

  <section class="grid">
    <div class="stat">
      <div class="label">管理仓库</div>
      <div id="statTotal" class="value">-</div>
    </div>
    <div class="stat">
      <div class="label">可更新</div>
      <div id="statBehind" class="value">-</div>
    </div>
    <div class="stat">
      <div class="label">被阻断</div>
      <div id="statBlocked" class="value">-</div>
    </div>
    <div class="stat">
      <div class="label">上游提示</div>
      <div id="statUpstream" class="value">-</div>
    </div>
  </section>

  <section class="panel auto-panel">
    <div class="auto-title">
      <h2>自动更新</h2>
      <span id="autoStatus" class="badge muted">读取中</span>
      <span id="autoTimeText" class="muted">-</span>
    </div>
    <div class="auto-controls">
      <input id="autoTime" type="time" step="60" value="04:30" />
      <button class="secondary" onclick="saveAutoTime()">保存时间</button>
      <button id="autoToggleButton" onclick="toggleAutoUpdate()">开启自动更新</button>
    </div>
  </section>

  <section class="panel">
    <div class="section-title">
      <h2>仓库状态</h2>
      <span id="lastRefresh" class="muted">尚未刷新</span>
    </div>
    <div id="repoPanel">
      <div class="toolbar">
        <input id="keyword" placeholder="筛选仓库、路径或状态" oninput="renderRepos()" />
        <select id="kindFilter" onchange="renderRepos()">
          <option value="">全部类型</option>
          <option value="root">Bot 本体</option>
          <option value="resources">resources</option>
          <option value="plugin">第三方插件</option>
        </select>
        <button onclick="loadRepos(false)">读取缓存</button>
        <button onclick="loadRepos(true)">检测更新</button>
        <button onclick="updateSelected()">更新选中</button>
        <button class="danger" onclick="forceUpdateSelected()">强制更新选中</button>
        <button class="secondary" onclick="checkUpstream()">检测上游</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th><input type="checkbox" id="checkAll" class="table-check" onchange="toggleAll(this.checked)" /></th>
              <th>仓库</th>
              <th>类型</th>
              <th>分支</th>
              <th>Ahead / Behind</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody id="repos"></tbody>
        </table>
      </div>
      <div class="addbar">
        <input id="pluginUrl" placeholder="新增插件 upstream，例如 https://github.com/owner/repo" />
        <button onclick="addPlugin()">新增插件</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="section-title">
      <h2>任务记录</h2>
      <button class="secondary" onclick="loadJobs()">刷新任务</button>
    </div>
    <pre id="jobs">等待加载...</pre>
  </section>
</main>

<script>
const API_BASE = "/zhenxun/api/update-manager";
let repos = [];
let upstreamResults = [];
let expandedRepos = new Set();
let commitCache = {};
// 按仓库记录正在进行的操作，让状态刷新和更新任务只影响对应行。
let repoOps = new Map();
let selectedRepos = new Set();
let settings = null;

function showError(message) {
  const el = document.getElementById("error");
  el.textContent = message;
  el.style.display = message ? "block" : "none";
}

async function runPanelAction(action) {
  showError("");
  try {
    await action();
  } catch (err) {
    showError(err.message);
  }
}

function showLogin(message = "") {
  document.getElementById("loginPanel").hidden = false;
  document.getElementById("appMain").hidden = true;
  document.getElementById("logoutButton").hidden = true;
  if (message) {
    const panel = document.getElementById("loginPanel");
    let error = panel.querySelector(".error");
    if (!error) {
      error = document.createElement("div");
      error.className = "error";
      panel.insertBefore(error, panel.querySelector(".login-form"));
    }
    error.textContent = message;
    error.style.display = "block";
  }
}

function showApp() {
  document.getElementById("loginPanel").hidden = true;
  document.getElementById("appMain").hidden = false;
  document.getElementById("logoutButton").hidden = false;
}

async function api(path, options = {}) {
  const resp = await fetch(API_BASE + path, {
    ...options,
    credentials: "same-origin",
    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {}),
    },
  });
  const data = await resp.json().catch(() => null);
  if (!resp.ok) {
    if (resp.status === 401) {
      showLogin("登录已失效，请重新输入密码。");
    }
    throw new Error(data?.detail || data?.info || "请求失败");
  }
  if (!data?.suc) {
    throw new Error(data?.info || "请求失败");
  }
  return data.data;
}

async function login() {
  const password = document.getElementById("loginPassword").value;
  if (!password) {
    showLogin("请输入密码。");
    return;
  }
  try {
    await api("/login", {
      method: "POST",
      body: JSON.stringify({ password }),
    });
    document.getElementById("loginPassword").value = "";
    showApp();
    await loadSettings();
    await loadRepos(false);
    await loadJobs();
  } catch (err) {
    showLogin(err.message);
  }
}

async function logout() {
  try {
    await api("/logout", { method: "POST", body: "{}" });
  } catch (err) {
    showError(err.message);
  } finally {
    repos = [];
    upstreamResults = [];
    expandedRepos = new Set();
    commitCache = {};
    repoOps = new Map();
    selectedRepos = new Set();
    settings = null;
    showLogin();
  }
}

function renderAutoSettings() {
  const enabled = Boolean(settings?.auto_enabled);
  const time = settings?.auto_time || "04:30";
  const status = document.getElementById("autoStatus");
  status.className = "badge " + (enabled ? "ok" : "muted");
  status.textContent = enabled ? "已开启" : "已关闭";
  document.getElementById("autoTimeText").textContent = `每天 ${time}`;
  document.getElementById("autoTime").value = time;
  document.getElementById("autoToggleButton").textContent = enabled
    ? "关闭自动更新"
    : "开启自动更新";
}

function setAutoBusy(value) {
  document.getElementById("autoTime").disabled = value;
  document.getElementById("autoToggleButton").disabled = value;
  document.querySelectorAll(".auto-controls button.secondary").forEach((button) => {
    button.disabled = value;
  });
}

async function loadSettings() {
  settings = await api("/settings");
  renderAutoSettings();
}

async function saveSettings(values) {
  showError("");
  setAutoBusy(true);
  try {
    settings = await api("/settings", {
      method: "PUT",
      body: JSON.stringify({ values }),
    });
    renderAutoSettings();
  } catch (err) {
    showError(err.message);
  } finally {
    setAutoBusy(false);
  }
}

async function saveAutoTime() {
  const auto_time = document.getElementById("autoTime").value;
  if (!auto_time) {
    showError("请选择自动更新时间。");
    return;
  }
  await saveSettings({ AUTO_TIME: auto_time });
}

async function toggleAutoUpdate() {
  await saveSettings({ AUTO_ENABLED: !Boolean(settings?.auto_enabled) });
}

function statusBadge(item) {
  const op = repoOp(item.repo.id);
  if (op) {
    return `<span class="badge muted"><span class="spinner"></span>${escapeHtml(op.label)}</span>`;
  }
  if (item.error) return `<span class="badge bad">采集失败</span>`;
  if (!item.exists || !item.is_git_repo) return `<span class="badge bad">不可用</span>`;
  if (item.update_block_reason) return `<span class="badge warn">被阻断</span>`;
  if (item.behind > 0) return `<span class="badge ok">可更新</span>`;
  return `<span class="badge muted">最新</span>`;
}

function statusText(item) {
  const op = repoOp(item.repo.id);
  if (op?.detail) return op.detail;
  return item.error || item.update_block_reason || (item.behind > 0 ? "可快进更新" : "已是目标分支最新");
}

function repoOp(repoId) {
  return repoOps.get(repoId) || null;
}

function repoBusy(repoId) {
  return repoOps.has(repoId);
}

function setRepoOp(repoId, label, detail = "") {
  repoOps.set(repoId, { label, detail });
  renderRepos();
}

function clearRepoOp(repoId) {
  repoOps.delete(repoId);
  renderRepos();
}

function updateRepoStatus(status) {
  const index = repos.findIndex((item) => item.repo.id === status.repo.id);
  if (index === -1) {
    repos.push(status);
  } else {
    repos[index] = status;
  }
}

function syncSelectedFromDom() {
  document.querySelectorAll(".repo-check").forEach((el) => {
    if (el.checked) {
      selectedRepos.add(el.value);
    } else {
      selectedRepos.delete(el.value);
    }
  });
}

function kindLabel(kind) {
  if (kind === "root") return "Bot 本体";
  if (kind === "resources") return "resources";
  return "第三方插件";
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");
}

function shortHash(hash) {
  return hash ? String(hash).slice(0, 7) : "-";
}

function remoteDisplayText(url) {
  return String(url || "")
    .replace(/^https?:\/\//i, "")
    .replace(/^git@github\.com:/i, "github.com/")
    .replace(/\.git$/i, "");
}

function remoteHref(url) {
  const text = String(url || "").trim();
  if (!text) return null;
  const sshMatch = text.match(/^git@github\.com:([^/\s]+)\/([^/\s]+?)(?:\.git)?$/i);
  if (sshMatch) {
    return `https://github.com/${sshMatch[1]}/${sshMatch[2].replace(/\.git$/i, "")}`;
  }
  const githubMatch = text.match(/^https?:\/\/github\.com\/([^/\s]+)\/([^/\s]+?)(?:\.git)?(?:[/?#].*)?$/i);
  if (githubMatch) {
    return `https://github.com/${githubMatch[1]}/${githubMatch[2].replace(/\.git$/i, "")}`;
  }
  return /^https?:\/\//i.test(text) ? text : null;
}

function renderRemoteLine(label, url) {
  if (!url) return "";
  const href = remoteHref(url);
  const text = escapeHtml(remoteDisplayText(url));
  const title = escapeHtml(url);
  const body = href
    ? `<a class="remote-link mono" href="${escapeHtml(href)}" title="${title}" target="_blank" rel="noopener noreferrer">${text}</a>`
    : `<span class="remote-text mono" title="${title}">${text}</span>`;
  return `<div class="remote-line"><span class="remote-label">${label}:</span>${body}</div>`;
}

function renderCommitBadges(commit, cached) {
  const badges = [];
  if (commit.hash === cached.current_hash) {
    badges.push(`<span class="badge ok">当前版本</span>`);
  }
  if (commit.hash === cached.running_hash) {
    badges.push(`<span class="badge running">运行版本</span>`);
  }
  if (commit.hash === cached.latest_hash) {
    badges.push(`<span class="badge latest">远程最新</span>`);
  }
  return badges.join("");
}

function renderVersionSummary(item, cached) {
  const parts = [
    `目标分支 ${escapeHtml(item.repo.target_branch)}`,
    `当前版本 ${escapeHtml(shortHash(cached.current_hash))}`,
    `运行版本 ${escapeHtml(shortHash(cached.running_hash))}`,
    `远程最新 ${escapeHtml(shortHash(cached.latest_hash))}`,
  ];
  return `<div class="version-summary muted">${parts.map((part) => `<span>${part}</span>`).join("")}</div>`;
}

function filteredRepos() {
  const keyword = document.getElementById("keyword").value.trim().toLowerCase();
  const kind = document.getElementById("kindFilter").value;
  return repos.filter((item) => {
    if (kind && item.repo.kind !== kind) return false;
    if (!keyword) return true;
    const haystack = [
      item.repo.name,
      item.repo.kind,
      item.repo.path,
      item.branch,
      item.origin_url,
      item.upstream_url,
      statusText(item),
    ].join(" ").toLowerCase();
    return haystack.includes(keyword);
  });
}

function renderStats() {
  const blocked = repos.filter((item) => item.error || item.update_block_reason).length;
  const behind = repos.filter((item) => !item.update_block_reason && !item.error && item.behind > 0).length;
  const upstreamBehind = upstreamResults.filter((item) => item.behind > 0).length;
  document.getElementById("statTotal").textContent = repos.length;
  document.getElementById("statBehind").textContent = behind;
  document.getElementById("statBlocked").textContent = blocked;
  document.getElementById("statUpstream").textContent = upstreamResults.length ? upstreamBehind : "-";
}

function renderRepos() {
  syncSelectedFromDom();
  const rows = filteredRepos().map((item) => {
    const repoId = item.repo.id;
    const expanded = expandedRepos.has(repoId);
    const busy = repoBusy(repoId);
    const checked = selectedRepos.has(repoId) ? "checked" : "";
    const disabled = busy ? "disabled" : "";
    return `
    <tr class="repo-row ${busy ? "busy" : ""}">
      <td>
        <span class="select-cell">
          <input type="checkbox" class="repo-check table-check" value="${escapeHtml(repoId)}" onchange="syncSelectedFromDom()" ${checked} ${disabled}>
          <button class="toggle-commits ${expanded ? "open" : ""}" title="查看 commit 记录" onclick="toggleCommits('${escapeHtml(repoId)}')" ${disabled}>${expanded ? "▾" : "▸"}</button>
        </span>
      </td>
      <td>
        <div class="repo-name">${escapeHtml(item.repo.name)}</div>
        <div class="path" title="${escapeHtml(item.repo.path)}">${escapeHtml(item.repo.path)}</div>
        ${renderRemoteLine("origin", item.origin_url)}
        ${renderRemoteLine("upstream", item.upstream_url)}
      </td>
      <td><span class="badge kind">${kindLabel(item.repo.kind)}</span></td>
      <td class="mono">${escapeHtml(item.branch || "-")}</td>
      <td class="mono">${item.ahead} / ${item.behind}</td>
      <td>
        ${statusBadge(item)}
        <div class="muted status-line">${escapeHtml(statusText(item))}</div>
      </td>
    </tr>
    ${expanded ? renderCommitPanel(item) : ""}
  `;
  }).join("");
  document.getElementById("repos").innerHTML = rows || `
    <tr><td colspan="6" class="muted">没有匹配的仓库</td></tr>
  `;
  renderStats();
}

function renderCommitPanel(item) {
  const repoId = item.repo.id;
  const cached = commitCache[repoId];
  const op = repoOp(repoId);
  if (op) {
    return `<tr class="commit-panel"><td colspan="6" class="muted">${escapeHtml(op.detail || op.label)}</td></tr>`;
  }
  if (!cached) {
    return `<tr class="commit-panel"><td colspan="6" class="muted">尚未加载 commit 记录</td></tr>`;
  }
  if (!cached.commits?.length) {
    return `<tr class="commit-panel"><td colspan="6" class="muted">没有可展示的 commit 记录</td></tr>`;
  }
  const currentIndex = cached.commits.findIndex((commit) => commit.hash === cached.current_hash);
  const rows = cached.commits.map((commit, index) => {
    const isCurrent = commit.hash === cached.current_hash;
    const isRunning = commit.hash === cached.running_hash;
    const isLatest = commit.hash === cached.latest_hash;
    const isFuture = currentIndex === -1 || index < currentIndex;
    return `
      <div class="commit-row ${isCurrent || isRunning || isLatest ? "marked" : ""}">
        <div class="commit-id mono">
          ${escapeHtml(commit.short_hash)}
          ${renderCommitBadges(commit, cached)}
        </div>
        <div title="${escapeHtml(commit.message)}">${escapeHtml(commit.message)}</div>
        <div class="muted">${escapeHtml(commit.author || "-")}</div>
        <div class="muted">${escapeHtml(commit.date || "-")}</div>
        <div class="commit-actions">
          ${renderCommitActions(repoId, commit, isCurrent, isFuture)}
        </div>
      </div>
    `;
  }).join("");
  return `
    <tr class="commit-panel">
      <td colspan="6">
        <div class="commit-box">
          ${renderVersionSummary(item, cached)}
          ${rows}
        </div>
      </td>
    </tr>
  `;
}

function renderCommitActions(repoId, commit, isCurrent, isFuture) {
  if (isCurrent) return `<span class="muted">已在此版本</span>`;
  const hash = escapeHtml(commit.hash);
  const label = isFuture ? "更新至此版本" : "回退到此版本";
  const forceLabel = isFuture ? "强制更新至此版本" : "";
  const disabled = repoBusy(repoId) ? "disabled" : "";
  return `
    <button class="secondary" onclick="checkoutCommit('${escapeHtml(repoId)}', '${hash}', false, '${label}')" ${disabled}>${label}</button>
    ${forceLabel ? `<button class="danger" onclick="checkoutCommit('${escapeHtml(repoId)}', '${hash}', true, '${forceLabel}')" ${disabled}>${forceLabel}</button>` : ""}
  `;
}

async function toggleCommits(repoId) {
  if (repoBusy(repoId)) return;
  if (expandedRepos.has(repoId)) {
    expandedRepos.delete(repoId);
    renderRepos();
    return;
  }
  expandedRepos.add(repoId);
  renderRepos();
  await loadCommits(repoId, true);
}

async function loadCommits(repoId, fetch = true) {
  if (repoBusy(repoId)) return;
  setRepoOp(repoId, "加载中", "正在加载 commit 记录");
  try {
    commitCache[repoId] = await api(`/repositories/${encodeURIComponent(repoId)}/commits?fetch=${fetch}&limit=30`);
    // commit 接口可能刷新了 origin refs，这里立刻重算主表状态，避免远程最新和 Ahead/Behind 脱节。
    const status = await api(`/repositories/${encodeURIComponent(repoId)}/status?fetch=false`);
    updateRepoStatus(status);
  } catch (err) {
    showError(err.message);
  } finally {
    clearRepoOp(repoId);
  }
}

async function refreshRepoStatus(repoId, fetch, label, detail) {
  setRepoOp(repoId, label, detail);
  try {
    const status = await api(`/repositories/${encodeURIComponent(repoId)}/status?fetch=${fetch}`);
    updateRepoStatus(status);
    return status;
  } catch (err) {
    showError(err.message);
    return null;
  } finally {
    clearRepoOp(repoId);
  }
}

async function loadRepos(fetch = false) {
  showError("");
  if (!fetch) {
    try {
      repos = await api("/repositories?fetch=" + fetch);
      document.getElementById("lastRefresh").textContent =
        "读取完成：" + new Date().toLocaleString();
      renderRepos();
    } catch (err) {
      showError(err.message);
    }
    return;
  }

  if (!repos.length) {
    await loadRepos(false);
  }
  await Promise.all(
    repos
      .map((item) => item.repo.id)
      .filter((repoId) => !repoBusy(repoId))
      .map((repoId) => refreshRepoStatus(repoId, true, "检测中", "正在刷新 origin 状态"))
  );
  document.getElementById("lastRefresh").textContent =
    "检测完成：" + new Date().toLocaleString();
}

function selectedRepoIds() {
  syncSelectedFromDom();
  const knownIds = new Set(repos.map((item) => item.repo.id));
  return [...selectedRepos].filter((repoId) => knownIds.has(repoId));
}

function toggleAll(checked) {
  const visibleIds = filteredRepos().map((item) => item.repo.id);
  visibleIds.forEach((repoId) => {
    if (repoBusy(repoId)) return;
    if (checked) {
      selectedRepos.add(repoId);
    } else {
      selectedRepos.delete(repoId);
    }
  });
  renderRepos();
}

async function refreshRepoAfterWrite(repoId) {
  await refreshRepoStatus(repoId, false, "刷新中", "正在读取更新后的仓库状态");
  if (expandedRepos.has(repoId)) {
    await loadCommits(repoId, false);
  }
}

async function runRepoUpdate(repoId, force) {
  setRepoOp(repoId, force ? "强制更新中" : "更新中", "正在执行 origin 更新任务");
  try {
    const job = await api("/repositories/update", {
      method: "POST",
      body: JSON.stringify({ repo_ids: [repoId], force }),
    });
    await waitJob(job.id);
  } catch (err) {
    showError(err.message);
  } finally {
    clearRepoOp(repoId);
  }
  await refreshRepoAfterWrite(repoId);
}

async function runSelectedUpdates(repoIds, force) {
  // 前端逐仓库提交任务，既显示排队顺序，也保留后端 Git 写锁的串行保护。
  repoIds.forEach((repoId) => {
    if (!repoBusy(repoId)) {
      setRepoOp(repoId, "排队中", "等待执行更新任务");
    }
  });
  for (const repoId of repoIds) {
    if (!repoBusy(repoId) || repoOp(repoId)?.label === "排队中") {
      await runRepoUpdate(repoId, force);
    }
  }
  await loadJobs();
}

async function updateSelected() {
  const repo_ids = selectedRepoIds();
  if (!repo_ids.length) {
    showError("请先选择要更新的仓库。");
    return;
  }
  if (!confirm("确认对选中仓库执行 origin ff-only 更新？")) return;
  await runPanelAction(async () => {
    await runSelectedUpdates(repo_ids, false);
  });
}

async function forceUpdateSelected() {
  const repo_ids = selectedRepoIds();
  if (!repo_ids.length) {
    showError("请先选择要强制更新的仓库。");
    return;
  }
  if (!confirm("确认强制更新选中仓库？这会丢弃已跟踪文件的本地修改，但不会清理未跟踪缓存文件。")) return;
  await runPanelAction(async () => {
    await runSelectedUpdates(repo_ids, true);
  });
}

async function checkoutCommit(repoId, commitHash, force, label) {
  if (repoBusy(repoId)) return;
  const warning = force
    ? "这会执行强制重置，丢弃已跟踪文件的本地修改，但不会清理未跟踪缓存文件。"
    : "如果存在已跟踪文件的本地修改，操作会被后端阻断。";
  if (!confirm(`确认${label}？\n${warning}`)) return;
  await runPanelAction(async () => {
    setRepoOp(repoId, "切换中", "正在切换仓库版本");
    try {
      const job = await api("/repositories/checkout", {
        method: "POST",
        body: JSON.stringify({ repo_id: repoId, commit_hash: commitHash, force }),
      });
      await waitJob(job.id);
    } finally {
      clearRepoOp(repoId);
    }
    await refreshRepoAfterWrite(repoId);
  });
}

async function checkUpstream() {
  const repo_ids = selectedRepoIds().filter((id) => id.startsWith("plugin:"));
  await runPanelAction(async () => {
    const job = await api("/repositories/upstream-check", {
      method: "POST",
      body: JSON.stringify({ repo_ids: repo_ids.length ? repo_ids : null }),
    });
    const result = await waitJob(job.id);
    upstreamResults = Array.isArray(result?.result) ? result.result : [];
    renderStats();
  });
}

async function addPlugin() {
  const repo_url = document.getElementById("pluginUrl").value.trim();
  if (!repo_url) {
    showError("请输入插件 upstream 仓库地址。");
    return;
  }
  if (!confirm("确认新增第三方插件？这会 clone 仓库并创建或连接组织 origin。")) return;
  await runPanelAction(async () => {
    const job = await api("/plugins/add", {
      method: "POST",
      body: JSON.stringify({ repo_url }),
    });
    await waitJob(job.id);
    await loadRepos(false);
  });
}

async function waitJob(id) {
  let last = null;
  const maxPolls = 900;
  for (let i = 0; i < maxPolls; i++) {
    last = await api("/jobs/" + id);
    document.getElementById("jobs").textContent = JSON.stringify(last, null, 2);
    if (last.state === "success" || last.state === "failed") break;
    await new Promise((resolve) => setTimeout(resolve, 1000));
  }
  if (last?.state === "failed") {
    showError(last.error || "任务执行失败");
  }
  if (last && last.state !== "success" && last.state !== "failed") {
    showError("任务仍在运行，可稍后刷新任务记录查看结果。");
  }
  return last;
}

async function loadJobs() {
  try {
    const jobs = await api("/jobs");
    document.getElementById("jobs").textContent = JSON.stringify(jobs, null, 2);
  } catch (err) {
    document.getElementById("jobs").textContent = err.message;
  }
}

async function bootstrap() {
  try {
    const session = await api("/session");
    if (!session?.authenticated) {
      showLogin();
      return;
    }
    showApp();
    await loadSettings();
    await loadRepos(false);
    await loadJobs();
  } catch (err) {
    showLogin(err.message);
  }
}

document.getElementById("loginPassword").addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    event.preventDefault();
    login();
  }
});

bootstrap();
</script>
